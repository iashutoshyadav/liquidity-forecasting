[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liqfc"
version = "1.0.0"
description = "Liquidity forecasting and risk monitoring: deterministic synthetic treasury data, daily cash positions, scenario forecasts, anomaly detection and evaluation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
liqfc = "liqfc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
